backend:
  name: github
  repo: frfdadmin/frfdwebsite
  branch: main
  base_url: https://frfdwebsite.pages.dev
  auth_endpoint: /api/auth
  authorize:
    - frfdadmin
    - revcam

# Media / image uploads go here
media_folder: assets/images/uploads
public_folder: /assets/images/uploads

# ── Collections ────────────────────────────────────────────
collections:

  # News & Updates posts
  - name: posts
    label: News & Updates
    folder: _posts
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: /news.html
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Headline for this update"

      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "MMMM D, YYYY"
        time_format: false
        default: ""

      - label: Excerpt
        name: excerpt
        widget: text
        hint: "Short summary shown on the news listing page (1–2 sentences)"

      - label: Featured Image
        name: image
        widget: image
        required: false
        hint: "Optional photo for this post"

      - label: Body
        name: body
        widget: markdown
        hint: "Full post content (optional — excerpt alone is fine for short updates)"

  # Site-wide settings (alert banner, contact overrides)
  - name: settings
    label: Site Settings
    files:

      - label: Alert Banner
        name: alert
        file: data/alert.json
        fields:
          - label: Show Alert Banner
            name: active
            widget: boolean
            default: false
            hint: "Toggle the red banner at the top of every page"
          - label: Alert Message
            name: message
            widget: string
            hint: "e.g. Burn ban in effect — no open burning until further notice"
          - label: Link URL
            name: link
            widget: string
            required: false
            hint: "Optional link URL for more info"
          - label: Link Text
            name: link_text
            widget: string
            required: false
            hint: "e.g. Learn more"

      - label: Board Members
        name: board_members
        file: data/board-members.json
        media_folder: /assets/images/staff
        public_folder: /assets/images/staff
        fields:
          - label: Board Members
            name: items
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - label: Name
                name: name
                widget: string
              - label: Role
                name: role
                widget: string
                hint: "e.g. Fire Commissioner — President"
              - label: Phone
                name: phone
                widget: string
                required: false
                hint: "e.g. (208) 280-2269"
              - label: Photo
                name: photo
                widget: image
                required: false
                hint: "Optional headshot or uniform photo"

      - label: Staff Directory
        name: staff
        file: data/staff.json
        media_folder: /assets/images/staff
        public_folder: /assets/images/staff
        fields:
          - label: Staff Members
            name: items
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - label: Name
                name: name
                widget: string
                required: false
                hint: "Leave blank if name is not yet available"
              - label: Role
                name: role
                widget: string
                hint: "e.g. Fire Chief"
              - label: Phone
                name: phone
                widget: string
                required: false
              - label: Email
                name: email
                widget: string
                required: false
              - label: Photo
                name: photo
                widget: image
                required: false
                hint: "Optional headshot or uniform photo"

      - label: Meeting Year Folders
        name: meeting_years
        file: data/meeting-years.json
        fields:
          - label: Years
            name: items
            widget: list
            summary: "{{fields.year}} — {{fields.url}}"
            fields:
              - label: Year
                name: year
                widget: string
                hint: "e.g. 2027"
              - label: Google Drive Folder URL
                name: url
                widget: string
                hint: "Shareable Google Drive folder link for this year's agendas"
